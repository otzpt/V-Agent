name: Release

# Builds V-Agent for Windows and Linux on GitHub runners and attaches the
# archives to a GitHub Release. Triggered by a version tag (v1.0.0) or manually.
#
# macOS is intentionally out of scope for now. Windows and Linux cover the
# current users; macOS can be added back later (it needs a Mac runner and
# signing setup). Tags with a suffix (v1.0.0-ci1) build without publishing, so
# the workflow can be exercised safely.
#
# Artifacts are UNSIGNED; the OS may warn about an unknown publisher on first run.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
    steps:
      # Zed's git dependencies have paths longer than the Windows 260-char
      # default; without this, cargo fails while fetching them.
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Linux: the exact dependency set from Zed's script/linux (fontconfig,
      # freetype, alsa, libgit2, va, glib, xcb, wayland, vulkan, ...).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig-dev libfreetype6-dev \
            libgit2-dev libva-dev libglib2.0-dev \
            libvulkan1 libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libzstd-dev libsqlite3-dev libssl-dev \
            make cmake clang lld llvm build-essential \
            curl git jq gettext-base elfutils \
            musl-tools musl-dev pipewire xdg-desktop-portal \
            pkg-config libstdc++-12-dev

      # Windows: point the icon-embedding build script at the SDK's rc.exe.
      - name: Locate Windows SDK rc.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                 Where-Object { Test-Path (Join-Path $_.FullName "x64\rc.exe") } |
                 Sort-Object Name -Descending | Select-Object -First 1
          if ($sdk) {
            "ZED_RC_TOOLKIT_PATH=$(Join-Path $sdk.FullName 'x64')" | Out-File $env:GITHUB_ENV -Append
          } else { Write-Warning "rc.exe not found" }

      # On failure, surface only the error-bearing lines as ::error::
      # annotations (readable without repo-admin log access).
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          # webrtc-sys (pulled in by LiveKit, for the collaboration feature we
          # disable) is old C++ that newer GCC rejects. -fpermissive downgrades
          # those errors to warnings so it still builds. Linux/GCC only.
          if [ "$RUNNER_OS" = "Linux" ]; then
            export CXXFLAGS="${CXXFLAGS:-} -fpermissive"
          fi
          if ! cargo build --release --target ${{ matrix.target }} --bin v-agent 2>&1 | tee build.log; then
            echo "----- error lines -----"
            grep -iE "error(\[|:|s)|cannot find|failed to|undefined|not found|fatal|panicked|no space" build.log | tail -20 || tail -20 build.log
            grep -iE "error(\[|:|s)|cannot find|failed to|undefined|not found|fatal|panicked|no space" build.log | tail -20 | sed 's/^/::error::/'
            exit 1
          fi

      # ---- Package -----------------------------------------------------------
      - name: Package Windows (portable zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rel = "target/${{ matrix.target }}/release"
          $out = "V-Agent-windows-x86_64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "$rel/v-agent.exe" $out
          foreach ($f in @("conpty.dll","OpenConsole.exe")) {
            if (Test-Path "$rel/$f") { Copy-Item "$rel/$f" $out }
          }
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force

      - name: Package Windows (MSI)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet tool install --global wix 2>&1 | Out-Null
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          pwsh packaging/windows/build-msi.ps1 `
            -TargetDir (Resolve-Path "target/${{ matrix.target }}").Path `
            -OutFile "$PWD/V-Agent-x64.msi"

      - name: Package Linux (tar.gz)
        if: runner.os == 'Linux'
        run: |
          rel="target/${{ matrix.target }}/release"
          out="V-Agent-linux-x86_64"
          mkdir -p "$out"
          cp "$rel/v-agent" "$out/"
          tar -czf "$out.tar.gz" "$out"

      # Icon + .desktop use the app id (io.github.otzpt.VAgent), which is also
      # the window WM_CLASS. That is what makes the desktop show V-Agent's icon
      # instead of Zed's (the previous "dev.zed.Zed" id matched an installed
      # Zed's icon). StartupWMClass ties the running window to this entry.
      - name: Package Linux (.deb)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          rel="target/${{ matrix.target }}/release"
          appid=io.github.otzpt.VAgent
          pkg=deb/v-agent
          # Track the crate version rather than a literal, for the same reason
          # the Arch package below does: a hardcoded version silently drifts
          # from the binary it ships (this said 1.0.0 through the 1.0.1 release).
          pkgver="$(script/get-crate-version zed)"
          mkdir -p "$pkg/DEBIAN" "$pkg/usr/bin" "$pkg/usr/share/applications" "$pkg/usr/share/icons/hicolor/512x512/apps"
          cp "$rel/v-agent" "$pkg/usr/bin/v-agent"
          cp crates/zed/resources/app-icon.png "$pkg/usr/share/icons/hicolor/512x512/apps/$appid.png"
          cat > "$pkg/DEBIAN/control" <<EOF
          Package: v-agent
          Version: $pkgver
          Architecture: amd64
          Maintainer: V-Agent <v-agent@noreply.invalid>
          Description: A native, GPU-accelerated code editor with local-first AI.
          EOF
          cat > "$pkg/usr/share/applications/$appid.desktop" <<EOF
          [Desktop Entry]
          Name=V-Agent
          Exec=/usr/bin/v-agent %U
          Icon=$appid
          Type=Application
          Categories=Development;TextEditor;
          StartupWMClass=$appid
          Terminal=false
          EOF
          dpkg-deb --build --root-owner-group "$pkg" "V-Agent-amd64.deb"

      # Fedora/RHEL package, built in a Fedora container for the same reason the
      # Arch package below uses one: the runner is Ubuntu and has no rpmbuild.
      # Requires: are not hand-listed. rpmbuild scans the ELF and generates the
      # soname dependencies itself, which stays correct as the binary's linkage
      # changes; a hand-written list would drift silently.
      - name: Package Linux (.rpm)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set -euo pipefail
          rel="$(pwd)/target/${{ matrix.target }}/release"
          appid=io.github.otzpt.VAgent
          pkgver="$(script/get-crate-version zed)"
          mkdir -p rpmpkg && cd rpmpkg
          cp "$rel/v-agent" v-agent
          cp "$GITHUB_WORKSPACE/crates/zed/resources/app-icon.png" icon.png
          cat > v-agent.desktop <<EOF
          [Desktop Entry]
          Name=V-Agent
          GenericName=Code Editor
          Comment=Native, GPU-accelerated code editor with local-first AI
          Exec=/usr/bin/v-agent %U
          Icon=$appid
          Type=Application
          Categories=Development;IDE;TextEditor;
          MimeType=text/plain;inode/directory;
          StartupNotify=true
          StartupWMClass=$appid
          Terminal=false
          EOF
          cat > v-agent.spec <<EOF
          Name:           v-agent
          Version:        $pkgver
          Release:        1%{?dist}
          Summary:        Native, GPU-accelerated code editor with local-first AI
          License:        GPL-3.0-or-later
          URL:            https://github.com/otzpt/V-Agent
          ExclusiveArch:  x86_64

          # This packages an already-built binary, so there is nothing to
          # compile and no separate debuginfo to split out. Same reasoning as
          # the Arch package's !strip/!debug options.
          %global debug_package %{nil}
          %global __os_install_post %{nil}

          %description
          V-Agent is a native, GPU-accelerated code editor with local-first AI,
          derived from Zed.

          %install
          install -Dm755 %{_sourcedir}/v-agent %{buildroot}%{_bindir}/v-agent
          install -Dm644 %{_sourcedir}/v-agent.desktop %{buildroot}%{_datadir}/applications/$appid.desktop
          install -Dm644 %{_sourcedir}/icon.png %{buildroot}%{_datadir}/icons/hicolor/512x512/apps/$appid.png

          %files
          %{_bindir}/v-agent
          %{_datadir}/applications/$appid.desktop
          %{_datadir}/icons/hicolor/512x512/apps/$appid.png
          EOF
          # dist is blanked deliberately: one prebuilt binary is shipped for all
          # Fedora versions, so tagging it .fc44 would claim a version-specific
          # build that was never made.
          docker run --rm -v "$(pwd)":/pkg -w /pkg fedora:latest bash -c '
            dnf install -y rpm-build >/dev/null &&
            rpmbuild -bb --define "_sourcedir /pkg" --define "_rpmdir /pkg/out" \
                         --define "dist %{nil}" v-agent.spec'
          cp out/x86_64/v-agent-*.x86_64.rpm "$GITHUB_WORKSPACE/V-Agent-x86_64.rpm"

      - name: Package Linux (AppImage)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          rel="target/${{ matrix.target }}/release"
          appid=io.github.otzpt.VAgent
          APPDIR=V-Agent.AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          cp "$rel/v-agent" "$APPDIR/usr/bin/v-agent"
          cp crates/zed/resources/app-icon.png "$APPDIR/$appid.png"
          cp crates/zed/resources/app-icon.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/$appid.png"
          cat > "$APPDIR/$appid.desktop" <<EOF
          [Desktop Entry]
          Name=V-Agent
          Exec=v-agent
          Icon=$appid
          Type=Application
          Categories=Development;
          StartupWMClass=$appid
          EOF
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/v-agent" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run "$APPDIR" "V-Agent-x86_64.AppImage"

      # Native Arch package (.pkg.tar.zst) — install with `pacman -U`. Built in
      # an Arch container running makepkg. No AUR involved; the package is
      # attached to the GitHub release directly.
      - name: Package Linux (Arch .pkg.tar.zst)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          rel="$(pwd)/target/${{ matrix.target }}/release"
          appid=io.github.otzpt.VAgent
          # Track the crate version rather than a literal, so the package
          # version cannot silently drift from the binary it contains.
          pkgver="$(script/get-crate-version zed)"
          mkdir -p archpkg && cd archpkg
          cp "$rel/v-agent" v-agent
          cp "$GITHUB_WORKSPACE/crates/zed/resources/app-icon.png" icon.png
          cat > v-agent.desktop <<EOF
          [Desktop Entry]
          Name=V-Agent
          GenericName=Code Editor
          Comment=Native, GPU-accelerated code editor with local-first AI
          Exec=/usr/bin/v-agent %U
          Icon=$appid
          Type=Application
          Categories=Development;IDE;TextEditor;
          MimeType=text/plain;inode/directory;
          StartupNotify=true
          StartupWMClass=$appid
          Terminal=false
          EOF
          # depends= mirrors the official Arch `zed` package. Without it the
          # package installs but the binary fails to start on a clean system,
          # because nothing pulls in the Wayland/Vulkan/fontconfig stack.
          cat > PKGBUILD <<EOF
          pkgname=v-agent
          pkgver=$pkgver
          pkgrel=1
          pkgdesc="Native, GPU-accelerated code editor with local-first AI"
          arch=('x86_64')
          url="https://github.com/otzpt/V-Agent"
          license=('GPL-3.0-or-later')
          depends=('alsa-lib' 'curl' 'fontconfig' 'gcc-libs' 'git' 'glib2'
                   'glibc' 'libxcb' 'libx11' 'libxkbcommon' 'libxkbcommon-x11'
                   'sqlite' 'vulkan-icd-loader' 'wayland' 'zstd')
          optdepends=('nodejs: language servers that ship as npm packages'
                      'npm: installing language servers at runtime'
                      'vulkan-driver: GPU acceleration')
          options=('!strip' '!debug')
          package() {
            install -Dm755 "\$startdir/v-agent" "\$pkgdir/usr/bin/v-agent"
            install -Dm644 "\$startdir/v-agent.desktop" "\$pkgdir/usr/share/applications/$appid.desktop"
            install -Dm644 "\$startdir/icon.png" "\$pkgdir/usr/share/icons/hicolor/512x512/apps/$appid.png"
          }
          EOF
          # --nodeps is deliberate: the container only assembles an already-built
          # binary, so it must not install the runtime stack just to package it.
          # The depends= above is what matters to end users at `pacman -U` time.
          docker run --rm -v "$(pwd)":/pkg -w /pkg archlinux:base-devel bash -c '
            useradd -m builder && chown -R builder /pkg &&
            sudo -u builder makepkg -f --noconfirm --nodeps'
          cp v-agent-*.pkg.tar.zst "$GITHUB_WORKSPACE/V-Agent-x86_64.pkg.tar.zst"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V-Agent-${{ matrix.name }}
          path: |
            V-Agent-windows-x86_64.zip
            V-Agent-x64.msi
            V-Agent-linux-x86_64.tar.gz
            V-Agent-amd64.deb
            V-Agent-x86_64.rpm
            V-Agent-x86_64.AppImage
            V-Agent-x86_64.pkg.tar.zst
          if-no-files-found: warn

  # GitHub has no native FreeBSD runner, so the build runs inside a FreeBSD VM
  # hosted on a Linux runner. This job is intentionally non-blocking for now:
  # FreeBSD is a new target and a VM-hosted build is slower and less stable than
  # the native runners, so a failure here must not hold back a release.
  build-freebsd:
    name: build (freebsd-x86_64)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.2'
          usesh: true
          # The v1.1.1-ci1 run got past gpui and fs, then lost merman-core and
          # settings_content to `signal: 9, SIGKILL` -- the OOM killer, not a
          # compile error. The action defaults to 6144MB of RAM but gives the VM
          # every host core, so cargo starts one rustc per core and the release
          # profile (codegen-units = 1, thin LTO, opt-level 3) makes each of them
          # expensive. Four at once do not fit in 6GB.
          #
          # ubuntu-latest is 4 cores / 16GB, so 12GB leaves the host its share,
          # and -j 2 below caps how many of these can run at once. Both are
          # needed: more RAM alone still lets four large crates land together.
          mem: 12288
          # script/freebsd is upstream's own dependency list, but its
          # finalize() falls back to `curl | sh` to fetch rustup, and curl is
          # neither in that list nor in the FreeBSD base system (base ships
          # fetch). Under `set -e` that aborts the whole script, so install
          # curl here.
          prepare: |
            # pkgconf provides pkg-config, which the x11 crate's build script
            # shells out to; jq is used by script/get-crate-version. Neither is
            # in script/freebsd's list nor in the FreeBSD base system.
            pkg install -y bash curl pkgconf jq
          run: |
            set -eux
            # script/freebsd runs `pkg install` with no -y, so it blocks on
            # "Proceed with this action? [y/N]" and dies on EOF under CI. The
            # env var overrides pkg.conf and behaves as if -y were passed.
            export ASSUME_ALWAYS_YES=YES
            ./script/freebsd
            # The rustup-init package installs a binary called `rustup-init`,
            # not `rustup`, so upstream's `which rustup` check never passes.
            # Drive it directly instead of relying on the network fallback.
            if ! command -v rustup >/dev/null 2>&1; then
              rustup-init -y --no-modify-path --default-toolchain stable
            fi
            . "$HOME/.cargo/env"
            rustc --version
            export ZED_BUNDLE=true
            export RELEASE_VERSION="$(script/get-crate-version zed)"
            # -j 2: see the mem note above. Trading build time for not being
            # OOM-killed, which is the right way round for a job that is
            # already slow and non-blocking.
            cargo build --release --package zed --bin v-agent -j 2
            out="V-Agent-freebsd-x86_64"
            mkdir -p "$out"
            cp target/release/v-agent "$out/"
            cp crates/zed/resources/app-icon.png "$out/"
            tar -czf "$out.tar.gz" "$out"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V-Agent-freebsd-x86_64
          path: V-Agent-freebsd-x86_64.tar.gz
          if-no-files-found: warn

  release:
    name: Publish release
    # build-freebsd is listed so the release waits for its artifact, but
    # always() means a FreeBSD failure still publishes the other platforms.
    needs: [build, build-freebsd]
    runs-on: ubuntu-latest
    # Publish only for clean version tags (v1.2.3). Suffixed tags (-ci1) build
    # but do not publish; manual runs never publish. always() must be combined
    # with an explicit build result check, or the release would publish even
    # when the main build failed.
    if: |
      always() && needs.build.result == 'success'
      && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            V-Agent release — Windows, Linux, and FreeBSD builds.

            **Windows:** `.msi` installer, or the portable `.zip`.
            **Debian / Ubuntu / Mint:** `.deb`
            **Fedora / RHEL:** `.rpm`
            **Arch:** `.pkg.tar.zst` (`pacman -U`)
            **Any Linux:** `.AppImage`, or the portable `.tar.gz`.
            **FreeBSD:** `V-Agent-freebsd-x86_64.tar.gz`

            FreeBSD is built in a VM rather than on a native runner and is
            non-blocking, so it may be absent from a given release.

            Unsigned: on first launch the OS may warn about an unknown
            publisher (Windows: *More info → Run anyway*).
